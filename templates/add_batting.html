{% extends "base.html" %}
{% block title %} - Log Batting {% endblock %}

{% block content %}
<div class="form-wrapper">
    <h2>Log Batting Innings</h2>
    <!-- Show error message if form submission fails -->
    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_batting') }}">
        <div class="form-row">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="format">Format</label>
                <select id="format" name="format" required>
                    <option value="">Select format</option>
                    <option value="Test">Test</option>
                    <option value="ODI">ODI</option>
                    <option value="T20">T20</option>
                </select>
            </div>
        </div>  

        <div class="form-row">
            <div class="form-group">
                <label for="runs">Runs (0-400)</label>
                <input type="number" id="runs" name="runs" min="0" max="400" required>
            </div>
            <div class="form-group">
                <label for="balls">Balls Faced (0-300)</label>
                <input type="number" id="balls" name="balls" min="0" max="300" required>
            </div>
        </div>

        <div class="form-row not-out-row">
           <label>
                <input type="checkbox" name="not_out" value="1"> Not Out
           </label>
        </div>

        <button type="submit" class="btn-primary submit-btn">Log Innings</button>
    </form>
</div>
{% endblock %}
