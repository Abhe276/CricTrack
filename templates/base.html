<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<!-- Blocks XSS attacks on every page default-src self means only resources from this domain are allowed-->

    <meta http-equiv="Content-Security-Policy" 
        content="default-src 'self';
                    style-src 'self' 'unsafe-inline';
                    script-src 'self';">
    <title>CricTrack{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
</head>
<body>

    <!-- Header with CricTrack logo -->
     <header>
        <div class ="header-inner">
            <a href="{{ url_for('index') }}" class="logo">Cric<span>Track</span></a>
        </div>
    </header>

    <!-- Navigation bar -->
     <nav>
        <div class="nav-inner">
            <a href="{{ url_for('index') }}"
              class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
            {% if session.get('id') %}
                <!--If the user is logged in then show History, Stats and Logout-->
                <a href="{{ url_for('history') }}"
                  class="{% if request.endpoint == 'history' %}active{% endif %}">History</a>
                <a href="{{ url_for('dashboard') }}"
                  class="{% if request.endpoint == 'dashboard' %}active{% endif %}">My Stats</a>
                <a href="{{ url_for('logout') }}">Logout</a> 
            {% else %}
                <!--If the user is logged out then show Login and Register-->
                <a href="{{ url_for('login') }}"
                  class="{% if request.endpoint == 'login' %}active{% endif %}">Login</a>
                <a href="{{ url_for('register') }}"
                  class="{% if request.endpoint == 'register' %}active{% endif %}">Register</a>
            {% endif %}
        </div>
    </nav>  

    <!-- Main content block that other pages will fill in -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>CricTrack &copy; 2026</p>
    </footer>

    <!-- Registration for service workers -->
     <script src="{{ url_for('static', filename='app.js') }}"></script>


</body>
</html>
