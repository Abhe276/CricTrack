{% extends "base.html" %}
{% block title %} - Log Fielding {% endblock %}

{% block content %} 
<div class="form-wrapper">
    <h2>Log Fielding Stats</h2>
    <!-- Show error message if form submission fails -->
    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_fielding') }}">
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="catches">Catches (0-10)</label>
                <input type="number" id="catches" name="catches" min="0" max="10" required>
            </div>
        </div>
        <div class="form-group">
            <label for="run_outs">Run Outs (0-10)</label>
            <input type="number" id="run_outs" name="run_outs" min="0" max="10" required>
        </div> 
    </div>

        <button type="submit" class="btn-primary submit-btn">Log Fielding</button>
    </form>
</div>
{% endblock %}
