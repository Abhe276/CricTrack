{% extends "base.html" %}
{% block title %} - Log Bowling {% endblock %}

{% block content %}
<div class="form-wrapper">
    <h2>Log Bowling Figures</h2>
    <!-- Show error message if form submission fails -->
    {% if error %}
        <div class="error-message">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('add_bowling') }}">
        <div class="form-row">
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label for="format">Format</label>
                <select id="format" name="format" required>
                    <option value="">Select format</option>
                    <option value="Test">Test</option>
                    <option value="ODI">ODI</option>
                    <option value="T20">T20</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="overs">Overs (0.0-50.0)</label>
                <input type="number" id="overs" name="overs" min="0" max="50" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="runs_given">Runs Given</label>
                <input type="number" id="runs_given" name="runs_given" min="0" required>
            </div>
        </div>

        <div class="form-group">
            <label for="wickets">Wickets (0-10)</label>
            <input type="number" id="wickets" name="wickets" min="0" max="10" required>
        </div>

        <button type="submit" class="btn-primary submit-btn">Log Figures</button>
    </form>
</div>
{% endblock %}
